project:
  type: website

filters:
  - filters/unblindfold.lua

website:
  title: "Unblindfold"
  description: "Un-blindfold the blindfolded via a rational Quranic approach"
  site-url: "https://unblindfold.com"
  repo-url: "https://github.com"
  repo-actions: [edit, source]
  page-navigation: true   # Adds Next / Previous buttons at bottom of articles

  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: "Topics"
        menu:
          - text: "Blindfolded"
            href: blindfolded/country-of-the-blind.md
          - text: "Concept of God"
            href: gods/unpredictable-world.md

  sidebar:
    style: "docked"
    search: true
    contents:
      - section: "Blindfolded"
        contents:
          - blindfolded/country-of-the-blind.md
          - blindfolded/inherited-religion.md
          - blindfolded/intellectual-blindness.md
      - section: "Concept of God"
        contents:
          - gods/unpredictable-world.md
          - gods/god-of-miracles.md
          - gods/no-miracles.md
          - gods/Quranic-God.md

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    include-in-header:
      text: |
        <link rel="preconnect" href="https://googleapis.com">
        <link rel="preconnect" href="https://gstatic.com" crossorigin>
        <link href="https://googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    fontsize: 1.1rem
    linestretch: 1.7
  pdf:
    documentclass: scrartcl
    toc: true
  epub:
    toc: true
