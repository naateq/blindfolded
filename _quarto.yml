          - text: "Blindfolded"
            href: articles/blindfolded/country-of-the-blind.md
          - text: "Atheism"
            href: articles/atheism/atheism.md
          - text: "Concept of God"
            href: articles/gods/unpredictable-world.md
          - text: "Reflect"
            href: articles/reflect/critique-of-reason.md

  sidebar:
