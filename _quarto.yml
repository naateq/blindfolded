          - articles/blindfolded/country-of-the-blind.md
          - articles/blindfolded/inherited-religion.md
          - articles/blindfolded/intellectual-blindness.md
      - section: "Atheism"
        contents:
          - articles/atheism/atheism.md
          - articles/atheism/objections.md
          - articles/atheism/sowhat.md
      - section: "Concept of God"
