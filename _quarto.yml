        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://googleapis.com" rel="stylesheet">
  typst:
    include-in-header: typst-show.typ
    toc: true
    margin:
      x: 1in
      y: 1in
  epub:
    toc: true
